name   : Test, Build, and Deploy | Modul 01 - lab2.2 Senior Project

on:
  push:
    branches:
      - main

jobs:
  test-build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [16]
        
    steps:
      - uses: actions/checkout@v4
      - name: Testing Build pre-Deploy
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run : npm install
      - run : npm run build

  deploy:
        needs: test-build
        runs-on: ubuntu-latest
    
        strategy:
            matrix:
                node-version: [16.x]

        steps:
          - name : Build app on VM
            uses: appleboy/ssh-action@master
            with:
                host : ${{secrets.HOST}}
                username : ${{secrets.USERNAME}}
                password : ${{secrets.PASSWORD}}
                port : ${{secrets.PORT}}
                script : |
                    eval "$(ssh-agent -s)"
                    ssh-add ~/.ssh/ssh-praktikan42
                    echo "Cek folder project";
                    [ ! -d "${HOME}/senpro/543213/modul02/senpro-github-action/"] &&
                    {
                        echo "Repository belum di clone, Cloning repository...";
                        mkdir -p ${HOME}/senpro/543213/modul02/modul02/;
                        cd ~/senpro/543213/modul02/;
                        git clone https://github.com/RAKASAMUD/senpro-github-action.git
                        cd ~/senpro/543213/modul02/senpro-github-action/;
                        echo "install package dan build project";
                        npm install;
                        npm run build;
                    } || {
                        echo "Repository sudah ada, building project...";
                        cd ~/senpro/543213/modul02/senpro-github-action/;
                        git restore .;
                        git pull origin main;
                        echo "install package dan build project";
                        npm install;
                        npm run build;
                    }
                